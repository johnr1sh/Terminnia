name: Terminnia quality checks

concurrency:
  group: terminnia-quality-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < app.js
          node --check sql-worker.js
      - name: Install locked dependencies
        run: npm ci
      - name: Run database adapter unit tests
        run: npm run test:unit
      - name: Run MySQL runner unit tests
        run: npm run test:runner
      - name: Enforce dependency security audit
        run: npm audit --audit-level=moderate
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Start built application server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/terminnia-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/terminnia-http.log
          exit 1
      - name: Run browser smoke tests
        run: npx playwright test tests/smoke.spec.js --reporter=line

  mysql-lab-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run MySQL 8.4 laboratory acceptance tests
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_ROOT_PASSWORD: rootpass
        run: bash tests/mysql-lab-ci.sh

  mysql-runner-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build isolated runner image
        run: docker build --pull -f runner/Dockerfile -t terminnia-runner-ci .
      - name: Start runner with disposable CI Docker daemon
        run: |
          docker run -d --name terminnia-runner-ci -p 8787:8787 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e NODE_ENV=development \
            terminnia-runner-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs terminnia-runner-ci
          exit 1
      - name: Test real isolated MySQL 8.4 execution
        env:
          RUNNER_URL: http://127.0.0.1:8787
        run: node tests/mysql-runner-integration.mjs
      - name: Stop runner and remove disposable sandboxes
        if: always()
        run: docker rm -f terminnia-runner-ci || true

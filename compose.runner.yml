services:
  mysql-runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    image: terminnia-mysql-runner:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RUNNER_PORT:-8787}:8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      PORT: "8787"
      RUNNER_ALLOWED_ORIGINS: ${RUNNER_ALLOWED_ORIGINS:?Set an exact browser origin allowlist}
      MYSQL_IMAGE: ${MYSQL_IMAGE:?Set a reviewed immutable MySQL image digest}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
